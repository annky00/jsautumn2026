</head>

<body>
    <script>

        const a = parseInt(prompt('Enter first number', '5'))
        const b = parseInt(prompt('Enter second number', '8'))
        const c = parseInt(prompt('Enter third number', '3'))

        let sum1 = a + 12 + b

        let sum2 = Math.sqrt((a + b) / (2 * a))

        let sum3 = Math.cbrt((a + b) * c)

        let sum4 = Math.sin(a / (-b))

        document.write(`S1 = ${sum1} <br> S2 = ${sum2} <br> S3 = ${sum3} <br> S4 = ${sum4}`)

    </script>
