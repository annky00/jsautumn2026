<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen%20Sans:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <script>
        const num1 = parseInt(prompt('Enter first number', '10'))
        const num2 = parseInt(prompt('Enter second number', '5'))

        const sum = num1 + num2
        const product = num1 * num2
        const quotient = num1 / num2

        document.write(`First number: ${num1}, second number: ${num2}`)
        document.write('<table>')
        document.write('<tr>')
        document.write('<th>Operation</th>')
        document.write('<th>Result</th>')
        document.write('</tr>')
        document.write('<tr>')
        document.write('<td>Addition</td>')
        document.write(`<td>${sum}</td>`)
        document.write('</tr>')
        document.write('<tr>')
        document.write('<td>Multiplication</td>')
        document.write(`<td>${product}</td>`)
        document.write('</tr>')
        document.write('<tr>')
        document.write('<td>Division</td>')
        document.write(`<td>${quotient}</td>`)
        document.write('</tr>')
        document.write('</table>')
    </script>
    <div>
        <a href="../index.html">back</a>
    </div>
    <style>
        body {
            font-size: 25px;
            background: linear-gradient(135deg, #244d38 0%, #183b2b 50%, #102c20 100%);
            font-family: "Playpen Sans", sans-serif;
            color: #fff;
        }

        a {
            transition: scale 0.5s;
            display: inline-block;
            color: rgb(0, 0, 0);
            text-transform: uppercase;
            font-weight: 600;
            margin-left: 20px;
            margin-top: 20px;
        }

        a:visited {
            color: rgb(255, 255, 255);
        }

        a:hover {
            scale: 1.2;
        }
    </style>
</body>

</html>
