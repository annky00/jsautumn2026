<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen%20Sans:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <script>
        const firstChildName = prompt('Enter name of the first child', 'Mariya')
        const firstChildCandies = parseInt(prompt('Enter quantity of candies, that the first child has', '20'))
        const secondChildName = prompt('Enter name of the second child', 'Petro')
        const secondChildCandies = parseInt(prompt('Enter quantity of candies, that the second child has', '8'))

        let result

        if (firstChildCandies < secondChildCandies)
            result = `${secondChildName} has more candies`
        else if (secondChildCandies < firstChildCandies)
            result = `${firstChildName} has more candies`
        else result = 'Two children have the same quantity of candies'

        document.write(result)

    </script>
    <div>
        <a href="../index.html">back</a>
    </div>
    <style>
        body {
            font-size: 25px;
            background: linear-gradient(135deg, #244d38 0%, #183b2b 50%, #102c20 100%);
            font-family: "Playpen Sans", sans-serif;
            color: #fff;
        }

        a {
            transition: scale 0.5s;
            display: inline-block;
            color: rgb(0, 0, 0);
            text-transform: uppercase;
            font-weight: 600;
            margin-left: 20px;
            margin-top: 20px;
        }

        a:visited {
            color: rgb(255, 255, 255);
        }

        a:hover {
            scale: 1.2;
        }
    </style>
</body>

</html>
